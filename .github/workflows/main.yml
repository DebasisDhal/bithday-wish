name: Deploy Angular Birthday Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Build Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"


      - name: Find Angular build
        run: |
          echo "Checking dist folder..."
          find dist -maxdepth 4 -type f | head -100


      - name: Prepare GitHub Pages
        run: |
          set -e

          INDEX_FILE=$(find dist -type f -name "index.html" -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          APP_DIR=$(dirname "$INDEX_FILE")

          echo "Angular application found at:"
          echo "$APP_DIR"

          mkdir -p page-dist

          cp -R "$APP_DIR"/. page-dist/

          # Angular fallback
          cp page-dist/index.html page-dist/404.html


      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: page-dist


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
