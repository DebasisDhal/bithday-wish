name: Deploy Angular Birthday Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: |
          npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare GitHub Pages files
        run: |
          set -e

          INDEX_FILE=$(find dist -type f -name "index.html" -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found inside dist/"
            echo "Build output:"
            find dist -maxdepth 4 -type f | head -100
            exit 1
          fi

          APP_DIR=$(dirname "$INDEX_FILE")
          echo "Angular build found at: $APP_DIR"

          mkdir -p page-dist
          cp -R "$APP_DIR"/. page-dist/

          # GitHub Pages fallback for Angular client-side navigation
          cp page-dist/index.html page-dist/404.html

          echo "Files prepared for GitHub Pages:"
          find page-dist -maxdepth 2 -type f | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: page-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
